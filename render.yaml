services:
  - type: web
    name: stempath-api
    runtime: python
    buildCommand: pip install -r requirements/production.txt && python manage.py collectstatic --noinput --settings=core.settings.production
    preDeployCommand: python manage.py migrate --settings=core.settings.production
    startCommand: gunicorn core.wsgi:application
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: core.settings.production
      - fromGroup: stempath-backend
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: stempath-redis
          property: connectionString
      - key: DB_NAME
        fromDatabase:
          name: stempath-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: stempath-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: stempath-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: stempath-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: stempath-db
          property: port

  - type: worker
    name: stempath-worker
    runtime: python
    buildCommand: pip install -r requirements/production.txt
    startCommand: celery -A core worker --loglevel=info
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: core.settings.production
      - fromGroup: stempath-backend
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: stempath-redis
          property: connectionString
      - key: DB_NAME
        fromDatabase:
          name: stempath-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: stempath-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: stempath-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: stempath-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: stempath-db
          property: port

  - type: worker
    name: stempath-beat
    runtime: python
    buildCommand: pip install -r requirements/production.txt
    startCommand: celery -A core beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: core.settings.production
      - fromGroup: stempath-backend
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: stempath-redis
          property: connectionString
      - key: DB_NAME
        fromDatabase:
          name: stempath-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: stempath-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: stempath-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: stempath-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: stempath-db
          property: port

  - type: web
    name: stempath-frontend
    runtime: node
    rootDir: Output
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://stempath-api.onrender.com/api/v1
      - key: NEXT_PUBLIC_APP_URL
        value: https://stempath-frontend.onrender.com
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        sync: false
      - key: NEXT_PUBLIC_POSTHOG_KEY
        sync: false
      - key: NEXT_PUBLIC_POSTHOG_HOST
        value: https://app.posthog.com

  - type: keyvalue
    name: stempath-redis
    plan: free
    ipAllowList: []

envVarGroups:
  - name: stempath-backend
    envVars:
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        value: stempath-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://stempath-frontend.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://stempath-api.onrender.com,https://stempath-frontend.onrender.com
      - key: FRONTEND_URL
        value: https://stempath-frontend.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: EMAIL_HOST
        value: smtp-relay.brevo.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: POSTHOG_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false

databases:
  - name: stempath-db
    plan: free