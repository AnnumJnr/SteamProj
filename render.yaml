services:
  - type: web
    name: stempath-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements/production.txt && python manage.py collectstatic --noinput --settings=core.settings.production
    startCommand: gunicorn core.wsgi:application
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: core.settings.production
      # sync: false = Render prompts for the value when the blueprint is
      # applied (nothing secret is stored in this file). See .env.example
      # for what each one means.
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: POSTHOG_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false

  # Scheduled ingestion: calls the pipeline directly via a management
  # command — no Celery worker or Redis broker involved. Free-plan cron
  # jobs run at most once per day, which suits idempotent upserts.
  # Schedule is UTC: 02:00 daily.
  - type: cron
    name: stempath-ingestion
    runtime: python
    plan: free
    schedule: "0 2 * * *"
    buildCommand: pip install -r requirements/production.txt
    startCommand: python manage.py ingest --settings=core.settings.production
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: core.settings.production
      - key: DJANGO_SECRET_KEY
        sync: false
      # Use the same DB values as stempath-api; DB_HOST must be the
      # INTERNAL hostname (dpg-xxxxx) — the cron service runs on
      # Render's network, like the API.
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      # YouTube ingestion fails (by design, logged per run) without it.
      - key: YOUTUBE_API_KEY
        sync: false

  - type: web
    name: stempath-frontend
    runtime: node
    rootDir: Output
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        sync: false

  - type: keyvalue
    name: stempath-redis
    plan: free
    ipAllowList: []

databases:
  - name: stempath-db
    plan: free
