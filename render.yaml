services:
  - type: web
    name: stempath-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements/production.txt && python manage.py collectstatic --noinput --settings=core.settings.production
    startCommand: gunicorn core.wsgi:application
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: core.settings.production

  - type: web
    name: stempath-frontend
    runtime: node
    rootDir: Output
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start

  - type: keyvalue
    name: stempath-redis
    plan: free
    ipAllowList: []

databases:
  - name: stempath-db
    plan: free
